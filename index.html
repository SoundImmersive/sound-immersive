<head>

<title>SOUND IMMERSIVE</title>

  <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff}
.hero{position:relative;height:72vh;min-height:520px;overflow:hidden}
.hero img{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.58)}
.hero-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%}
.hero h1{font-size:clamp(42px,7vw,76px);letter-spacing:3px;font-weight:500}
.hero p{margin-top:12px;opacity:.85;font-size:16px}
.section{padding:65px 5vw 30px}
.section h2{font-size:28px;font-weight:400;margin-bottom:8px}
.section p{color:#888;margin-bottom:30px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2px}
.card{position:relative;height:430px;overflow:hidden;display:block;color:#fff;text-decoration:none;background:#111}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s ease}
.card:hover img{transform:scale(1.08)}
.card-overlay{position:absolute;left:0;right:0;bottom:0;padding:30px 24px 24px;background:linear-gradient(to top,rgba(0,0,0,.88),transparent)}
.card h3{font-size:26px;font-weight:500}
.card p{margin-top:7px;font-size:14px;color:#ddd}
footer{text-align:center;padding:55px;color:#666;font-size:13px}
</style></head>

<section class="hero">

</div>
</section>
<footer>© Sound Immersive</footer>
