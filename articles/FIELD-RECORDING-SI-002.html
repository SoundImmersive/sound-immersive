<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Recording: ZOOM H1e. Le calme d’une fin d’après-midi à Véron</title>

<!-- Open Graph (preview réseaux) -->
<meta property="og:title" content="Field Recording: ZOOM H1e. Une pause au cœur du départ">
<meta property="og:description" content="Immersion visuelle et sonore">
<meta property="og:image" content="https://tonsite.com/images/preview.jpg">
<meta property="og:type" content="website">

<style>
body { margin:0; background:#000; overflow:hidden; }

.slide {
  position:fixed;
  inset:0;
  z-index: 1;
  background-size: contain;
  background-repeat: no-repeat;
  background-color: black;
  background-position:50% 40%;
  opacity:0;
  transition: opacity 3s ease-in-out;
}

.slide.active {
  opacity:1;
  animation: cinematicMove 25s ease-in-out infinite;
  // animation: zoomLoop 20s ease-in-out infinite
}
  
@keyframes cinematicMove {
  0% {
    transform: scale(1.02) translate(0%, 0%);
  }
  25% {
    transform: scale(1.05) translate(-1%, -1%);
  }
  50% {
    transform: scale(1.08) translate(-2%, 1%);
  }
  75% {
    transform: scale(1.05) translate(1%, 2%);
  }
  100% {
    transform: scale(1.02) translate(0%, 0%);
  }
}
  
@keyframes zoomLoop {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.08) translate(-1%, -1%);
  }
  100% {
    transform: scale(1);
  }
}

.overlay {
  position:fixed;
  bottom:40px;
  left:40px;
  color:white;
  background:rgba(0,0,0,0.4);
  padding:20px;
  backdrop-filter: blur(10px);
}

#soundButton {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: 0.3s;
  z-index: 10; /* important */
}

#soundButton:hover {
  background: rgba(255,255,255,0.2);
}

#bandcamp-player {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 20;
  opacity: 0.85;
}

  
</style>
</head>
<body>

<div id="slides"></div>
<div class="overlay">
  <h1>Field Recording: ZOOM H1e. Le calme d’une fin d’après-midi à Véron</h1>
  <p>Fermez les yeux, vous y êtes !</p>
</div>

<div id="soundButton">🎧 Écouter l’ambiance sonore</div>
  
<script>
const btn = document.getElementById("soundButton");

const player = document.getElementById("bandcamp-player");

btn.addEventListener("click", () => {
  player.style.display = "block";
  btn.style.display = "none";
});

const slideDuration = 25; // durée de chaque photo en secondes
const s = [
  {
    src: "../image/verontitre.jpg",
    focus: "center" // ou center, top, bottom
  },
  {
    src: "../image/veron1.jpg",
    focus: "center" // ou center, top, bottom
  },
  {
    src: "../image/veron2.jpg",
    focus: "center" // ou center, top, bottom
  },
  {
    src: "../image/veron3.jpg",
    focus: "center" // ou center, top, bottom
  },
  {
    src: "../image/veron4.jpg",
    focus: "center" // ou center, top, bottom
  },
  {
    src: "../image/veron5.jpg",
    focus: "center" // ou center, top, bottom
  }
];

const container = document.getElementById("slides");

let index = 0;

s.forEach((item, i) => {
  const div = document.createElement("div");
  div.className = "slide";

  div.style.backgroundImage = `url(${item.src})`;

  // 🎯 Cadrage selon focus
  switch(item.focus) {
    case "top":
      div.style.backgroundPosition = "50% 20%";
      break;
    case "bottom":
      div.style.backgroundPosition = "50% 80%";
      break;
    default:
      div.style.backgroundPosition = "50% 50%";
  }

  if (i === 0) div.classList.add("active");

  container.appendChild(div);
});
  
function next(){
  const slides = document.querySelectorAll(".slide");

  slides[index].classList.remove("active");

  index = (index + 1) % slides.length;

  slides[index].classList.add("active");
}

setInterval(next, slideDuration * 1000);
</script>

<div id="bandcamp-player">
<iframe style="border: 0; width: 100%; height: 42px;" src="https://bandcamp.com/EmbeddedPlayer/album=3520980345/size=small/bgcol=ffffff/linkcol=0687f5/transparent=true/" seamless><a href="https://isound.bandcamp.com/album/sound-of-v-ron">Sound of Véron by Antoine Chioccarello</a></iframe>

</body>
</html>
